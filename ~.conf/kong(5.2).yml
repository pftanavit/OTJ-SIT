_format_version: "3.0"
services:
  - name: whoami-service
    url: http://kong-backend:80
    routes:
      - name: whoami-route
        paths:
          - /api/whoami
        strip_path: true
        plugins:
          - name: rate-limiting
            config:
              minute: 3
              policy: local

# From Stage 5, Session 5.2: Add A Policy Plugin (Rate Limiting).
